apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: devops-k8s-demo
  namespace: devops-demo

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-k8s-demo

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70